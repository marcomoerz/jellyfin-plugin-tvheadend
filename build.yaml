changelog: |-
  - Keep the length of a running recording up to date, so reopening it offers what has been recorded since
  - Report the length of a recording on the item itself, not only on its media source
  - Report the codecs of a recording, so clients that support them play it directly instead of transcoding
  - Derive the bitrate of a recording from its size and duration instead of leaving Jellyfin to assume 40 Mbit/s
  - Allow watching a recording while it is still running, including when its end time is moved
  - Probe a live TV channel once and remember what it contains, instead of before every playback
  - Stop claiming every recording is interlaced, which by itself forced a transcode
  - Refresh the recordings listing whenever TVHeadend reports a change
  - Rework the HTSP connection: correlate replies reliably, fail fast instead of hanging, reconnect once
  - Fix an encoding defect that corrupted numbers containing a zero byte on their way to TVHeadend
  - Jellyfin 10.11 support (#100) @crobibero
  - Restore subtitles and multiple audio that got destroyed in commit db8cd9af238813a7b141ba826168fdaa22f1509e on Feb 18, 2018 (#68) @roman-vanicek
  - Further Release 10.9.x improvements (#92) @lomion0815
  - Readme: update build requirements (#93) @citronalco
  - Fixed link to TVHeadend image (#83) @lomion0815
  - Set correct dates for recordings (#84) @lomion0815
  - Changed HTSP field "summary" to correct name "subtitle". (#85) @lomion0815
