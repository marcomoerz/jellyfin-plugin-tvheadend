changelog: |-
  - Make deleting a recording idempotent and report failures to Jellyfin instead of only logging them, so recordings already gone from TVHeadend can be removed from the library
  - Refresh the recordings channel when a recording changes, instead of serving a cached listing for up to three hours
  - Use a GUID as the media source id of a recording instead of the numeric TVHeadend DVR id
  - Do not keep waiting for the TVHeadend connection after the caller cancelled
  - Re-read the plugin configuration when it changes instead of caching it until restart
  - Jellyfin 10.11 support (#100) @crobibero
  - Restore subtitles and multiple audio that got destroyed in commit db8cd9af238813a7b141ba826168fdaa22f1509e on Feb 18, 2018 (#68) @roman-vanicek
  - Further Release 10.9.x improvements (#92) @lomion0815
  - Readme: update build requirements (#93) @citronalco
  - Fixed link to TVHeadend image (#83) @lomion0815
  - Set correct dates for recordings (#84) @lomion0815
  - Changed HTSP field "summary" to correct name "subtitle". (#85) @lomion0815
